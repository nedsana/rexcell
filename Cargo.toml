[package]
name = "rexcell"
version = "0.1.0"
edition = "2024"

[dependencies]
umya-spreadsheet = "2.2.0"
clap = { version = "4.0", features = ["derive"] }
eframe = "0.27"
rfd = "0.12"

[[bin]]
name = "gui"
path = "src/gui.rs"

[[bin]]
name = "rexcell"
path = "src/main.rs"

[package.metadata.packager]
before-packaging-command = "cargo build --release --target x86_64-pc-windows-gnu"
formats = ["nsis"] # Classic Setup.exe installer for Windows